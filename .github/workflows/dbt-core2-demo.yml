# dbt Core 2.0 writing to the OneLake Iceberg catalog — a DEMO, not a measurement.
#
# WHAT IT SHOWS: dbt-core 2.0 can create and commit an Iceberg table in OneLake with no
# `dbt-duckdb`, no `duckdb` pip package and no adapter install of any kind. It provisions its own
# lakehouse, writes a table through a `catalogs.yml` REST catalog, reads the parquet footer back,
# and deletes the lakehouse.
#
# ⚠️ **NOTHING HERE MEASURES ANYTHING, AND THE GEOMETRY IS THE REASON.** Its compiled
# `duckdb__create_table_as` emits a bare `create table` with no `WITH (…)` clause, and the strings
# `write.parquet`, `row-group-size` and `target-file-size` appear ZERO times in its 285 MB binary —
# so Iceberg write geometry cannot be dispatched from it at all, and unlike dbt-core 1.x's
# `dbt-duckdb` the macro is compiled into Rust and cannot be overridden the way
# `macros/iceberg_adapter_overrides.sql` overrides it today. Measured 2026-09-10: 4M rows of
# 20 BIGINT columns came out at **122,880 rows per row group** — DuckDB's raw default, i.e. the
# bundled `duckdb_extended 0.21.0.dev+dbt0.0.29` driver does NOT carry duckdb-iceberg#1202, whose
# 128 MB byte budget would have given ~827K. That is the pre-pin writer this repo already parked six
# iceberg runs in `history/runs/legacy/` over. So a number from here must never enter `history/`.
#
# THE ARCHITECTURE, because it is nothing like the leg's. `pip install dbt-core==2.x` lays down a
# 108 KB `dbt.exe` launcher and a ~285 MB `dbt/_core.pyd` — the whole engine, Rust, compiled as one
# Python extension module. Connections go through ADBC (a vendored `arrow-adbc` plus dbt's own
# `dbt-adbc` crate); DuckDB is reached through the DuckDB ADBC driver (`duckdb_adbc_init`), which
# for DuckDB alone is statically linked rather than fetched from their driver CDN. `dbt --version`
# prints no Plugins section because there are no plugins.
#
# IT IS ITS OWN EVERYTHING, deliberately, in the shape `DuckDB main smoke` already established:
# its own lakehouse name (`provision.py core2` → `dbt_core2_demo`), because `ensure()` reuses an
# item by DISPLAY NAME and `teardown` deletes by GUID — so borrowing `dbt_iceberg` would let this
# demo share a real build's lakehouse and then delete it mid-run; and its own concurrency group,
# because `onelake-<ref>` holds at most one pending run and a free demo must never evict a queued
# `Benchmark`. Dispatch-only, like every workflow here that creates a Fabric item.
#
# It writes no run record to `history/`, reads no ledger and publishes nothing.

name: dbt Core 2 demo

on:
  workflow_dispatch:
    inputs:
      dbt_version:
        description: "dbt-core version (2.x pre-release; 2.0.0 is not out)"
        type: string
        default: "2.0.0rc2"
      rows:
        description: "rows to write"
        type: string
        default: "4000000"

permissions:
  id-token: write        # OIDC for azure/login
  contents: read

concurrency:
  # Its OWN group — see the header. Never `onelake-<ref>`.
  group: dbt-core2-demo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `provision.py` writes the item GUIDs here and `teardown` deletes what it names. Same
      # mechanism as every other job — no bespoke deletion code.
      RUN_RECORD: ${{ github.workspace }}/record/record-00-core2.json
      WS_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      # `provision.py` imports `datasets.selected()` at module scope and refuses an unknown name.
      # Nothing here reads a dataset; this just satisfies the import.
      DATASET: aemo
      CORE2_ROWS: ${{ inputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # dbt-core 2 requires >= 3.11

      - name: Install dbt-core (no adapter, no duckdb package)
        run: |
          set -euo pipefail
          pip install -q --pre "dbt-core==${{ inputs.dbt_version }}"
          echo "--- what actually got installed ---"
          pip list 2>/dev/null | grep -iE "dbt|duckdb" || true
          dbt --version

      # The step summary is the VERSION and the WRITTEN LAYOUT, and nothing else. The rest of what
      # this run establishes is in the header above, where it belongs.
      - name: Open the step summary
        run: |
          set -euo pipefail
          {
            echo "### dbt Core demo"
            echo
            echo "| fact | value |"
            echo "|---|---|"
            echo "| dbt | \`$(dbt --version | head -1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Provision the demo lakehouse
        run: |
          set -euo pipefail
          # `record.item()` writes the fragment to this path and will not create its directory.
          mkdir -p "$(dirname "$RUN_RECORD")"
          pip install -q requests
          python .github/scripts/provision.py core2 >> "$GITHUB_ENV"

      # The OIDC session `azure/login` just established is the whole credential — no interactive
      # login is ever legitimate on a runner, so stdin is closed: a prompt must DIE, not wait.
      - name: Mint a OneLake token
        run: |
          ST=$(az account get-access-token --resource https://storage.azure.com/ \
                 --query accessToken -o tsv < /dev/null)
          echo "::add-mask::$ST"; echo "ONELAKE_TOKEN=$ST" >> "$GITHUB_ENV"

      # THE DEMO. Everything dbt Core 2 needs is three files and no adapter.
      #
      # ⚠️ **EVERY CONFIG FILE IS WRITTEN BY PYTHON, NEVER BY A `cat <<YML` HEREDOC, AND THAT IS A
      # SAFETY RULE RATHER THAN A STYLE ONE.** An UNQUOTED heredoc delimiter makes the shell perform
      # command substitution on the body, so the backticks in these comments are executed. Run
      # 34473092126 ran this file's own prose: `settings:: command not found`,
      # `generate_secret_sql: command not found`, `/home/runner/.duckdb: No such file or directory`
      # — and then the backticked `az login` in the note below, which with no browser falls back to
      # DEVICE CODE and blocks forever. It printed
      # `To sign in, use a web browser to open the page https://login.microsoft.com/device` and sat
      # there until it was cancelled by hand 4m38s later. `set -euo pipefail` does not catch it: the
      # substitution did not fail, it WAITED. OIDC had already succeeded two steps earlier.
      # A quoted `<<'YML'` plus `sed` is NOT the fix either — the token is base64url and can carry
      # `/` and `&`, which `sed` would eat. The token goes in by `str.replace` on a placeholder.
      #
      # ⚠️ THE SCHEMA MUST ALREADY EXIST. OneLake refuses namespace creation — a first attempt at
      # duckdb's default `main` died `UnprocessableContent_422` on POST …/namespaces — so the
      # profile pins `schema: dbo`, which a Fabric lakehouse always has.
      #
      # TWO SECRETS, NOT ONE: `type: azure` for OneLake storage and `type: iceberg` for the REST
      # catalog bearer token. Both take the same `storage.azure.com` token the leg already mints.
      # They are written into profiles.yml, so the token DOES land in a file here — unavoidable,
      # since dbt Core 2 has no `getenv()` equivalent the way the DuckDB CLI does. The file is deleted
      # in the same step and the runner is ephemeral; do not lift this pattern into a job that
      # persists anything.
      - name: Write a table through the OneLake Iceberg catalog
        env:
          # libcurl reads these itself, independent of anything dbt or DuckDB configures — a second
          # route to the same CA bundle in case the `GLOBAL ` key ever stops reaching the setting.
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          set -euo pipefail

          # BELT, NOT THE FIX. `Problem with the SSL CA cert (path? access rights?)` is curl
          # error 77 -- a CA bundle at a path that is not there. The curl inside
          # `_core.abi3.so` is statically linked and may be built for a CA path Ubuntu does
          # not have, which is why CURL_CA_BUNDLE alone changed nothing on runs 34472868381
          # and 34474543493. Point every well-known path at Ubuntu's bundle; it is free and
          # rules the whole class out.
          for t in /etc/pki/tls/certs/ca-bundle.crt /etc/pki/tls/cert.pem /etc/ssl/cert.pem \n                   /usr/local/share/certs/ca-root-nss.crt; do
            [ -e "$t" ] || { sudo mkdir -p "$(dirname "$t")" && sudo ln -sf /etc/ssl/certs/ca-certificates.crt "$t"; }
          done
          ls -l /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/cert.pem || true

          export CORE2_DIR="$RUNNER_TEMP/core2"
          mkdir -p "$CORE2_DIR/models"
          trap 'rm -f "$CORE2_DIR/profiles.yml"' EXIT

          # `<<'PY'` — QUOTED. The shell does not parse a line of this, which is the whole point;
          # see the warning above the step. Every value arrives through `os.environ`.
          python - <<'PY'
          import os, pathlib, textwrap

          D = pathlib.Path(os.environ["CORE2_DIR"])
          TOKEN = os.environ["ONELAKE_TOKEN"]
          assert TOKEN, "ONELAKE_TOKEN is empty — the OIDC login/mint step did not run"
          SUBS = {
              "__ONELAKE_TOKEN__": TOKEN,
              "__ONELAKE_ENDPOINT__": os.environ["ONELAKE_ENDPOINT"],
              "__WAREHOUSE_PATH__": os.environ["WAREHOUSE_PATH"],
          }

          def write(name, body):
              text = textwrap.dedent(body).lstrip("\n")
              for k, v in SUBS.items():
                  text = text.replace(k, v)
              assert "__" not in text, name + ": a placeholder went unsubstituted"
              (D / name).write_text(text, encoding="utf-8", newline="\n")
              print("--- " + name + " ---")
              print(text.replace(TOKEN, "***"))

          # THE `pre_hook` IS THE ONLY ROUTE LEFT TO A DuckDB SETTING FROM dbt CORE 2. A `settings:`
          # block runs on a THROWAWAY connection (dbt-auth's own doc comment says so) and a
          # `GLOBAL ` prefix is normalised into the key name -- measured, runs 34472396259 and
          # 34472711289. A pre_hook runs on the MODEL's own connection, so a plain session-scoped
          # SET is enough and no GLOBAL is needed. Without it the write dies on
          # `Problem with the SSL CA cert` against onelake.blob.fabric.microsoft.com (runs
          # 34472868381, 34474543493) -- the same reason every OneLake-touching duckdb session in
          # `duckdb-main.yml` sets it. It lives in dbt_project.yml rather than the model header
          # purely so no nested quoting has to survive two layers of heredoc.
          write("dbt_project.yml", """
              name: core2_demo
              profile: core2_demo
              version: "1.0"
              flags:
                use_catalogs_v2: true
              models:
                core2_demo:
                  +pre_hook: "SET azure_transport_option_type = 'curl'"
          """)

          # The four write-compat options are the ones the iceberg leg already passes to ATTACH.
          write("catalogs.yml", """
              catalogs:
                - name: onelake
                  type: iceberg_rest
                  table_format: iceberg
                  config:
                    duckdb:
                      endpoint: "__ONELAKE_ENDPOINT__"
                      warehouse: "__WAREHOUSE_PATH__"
                      secret: onelake_cat
                      default_schema: dbo
                      access_delegation_mode: NONE
                      stage_create_tables: false
                      skip_create_table_metadata_updates: true
          """)

          write("profiles.yml", """
              core2_demo:
                target: dev
                outputs:
                  dev:
                    type: duckdb
                    path: ':memory:'
                    schema: dbo
                    # NO `settings:` BLOCK - IT CANNOT REACH THIS SETTING, MEASURED TWICE.
                    # `dbt-auth`'s `generate_duckdb_init_sql` emits `SET {key} = {value}` and
                    # `apply_duckdb_init_sql` runs it on a TEMPORARY connection (its own doc
                    # comment says so), so a bare `SET` is session-scoped and dies before the model
                    # runs - run 34472396259 failed identically WITH the setting in place.
                    # Attachments survive that connection because they are database-scoped;
                    # settings do not. Spelling the key `GLOBAL azure_transport_option_type` to
                    # smuggle in `SET GLOBAL` does not work either: the key is normalised and run
                    # 34472711289 died on `unrecognized configuration parameter
                    # "GLOBALazure_transport_option_type"`. So the CA bundle is supplied to libcurl
                    # by ENV VAR on the step instead.
                    secrets:
                      # `persistent: true` IS WHAT MAKES THE STORAGE CREDENTIAL REACH THE MODEL.
                      # `dbt-auth`'s `generate_secret_sql` defaults `persistent` to false and emits
                      # `CREATE OR REPLACE SECRET` - session-scoped - and `apply_duckdb_init_sql`
                      # runs it on a TEMPORARY connection. The catalog ATTACH survives that
                      # connection because attachments are database-scoped; the SECRET does not. So
                      # the model's own connection reached OneLake with no credential and died
                      # `could not open file '.../data' ... this could mean the credentials used
                      # were wrong` (runs 34472151740, 34472396259, 34472868381). PERSISTENT writes
                      # it to `~/.duckdb`, i.e. the token lands on disk - acceptable only because
                      # this runner is ephemeral and profiles.yml already holds it. Do not lift
                      # into anything that persists.
                      #
                      # It never bit the by-hand run on Windows: an `az login` credential chain is
                      # picked up by the azure extension without any secret, so the missing one was
                      # free there. UNTESTED as of run 34473092126, which never reached the model.
                      - type: azure
                        name: onelake_storage
                        provider: access_token
                        persistent: true
                        access_token: "__ONELAKE_TOKEN__"
                      - type: iceberg
                        name: onelake_cat
                        persistent: true
                        token: "__ONELAKE_TOKEN__"
          """)

          cols = ", ".join("i + {0} AS c{0}".format(n) for n in range(20))
          rows = str(int(os.environ["CORE2_ROWS"]))
          (D / "models" / "demo.sql").write_text(
              '{{ config(materialized="table", catalog_name="onelake") }}\n'
              "select " + cols + " from range(" + rows + ") t(i)\n",
              encoding="utf-8", newline="\n")
          print("--- models/demo.sql ---")
          print((D / "models" / "demo.sql").read_text(encoding="utf-8"))
          PY

          # `< /dev/null` — an interactive prompt must DIE, not wait. Run 34473092126 sat on a
          # device-code prompt for 4m38s with a perfectly good OIDC token already in hand.
          cd "$CORE2_DIR" && DBT_PROFILES_DIR="$CORE2_DIR" dbt run --select demo < /dev/null

      # WHAT IT ACTUALLY WROTE. The REST catalog returns no file list, so this globs the direct
      # abfss path `provision.py` handed back. `azure_transport_option_type = 'curl'` is REQUIRED on
      # a bare runner — without it the read dies on "Problem with the SSL CA cert", which is why
      # every OneLake-touching duckdb session in `duckdb-main.yml` sets it too.
      - name: Read the parquet footer back
        run: |
          set -euo pipefail
          pip install -q duckdb requests
          python - <<'PY'
          import os, duckdb
          c = duckdb.connect()
          c.sql("INSTALL azure; LOAD azure")
          c.sql("SET azure_transport_option_type = 'curl'")
          c.execute("CREATE SECRET s (TYPE azure, PROVIDER access_token, ACCESS_TOKEN ?)",
                    [os.environ["ONELAKE_TOKEN"]])
          # ⚠️ ASK THE CATALOG WHERE THE TABLE IS. dbt Core 2 does not put it at a path this
          # workflow can derive -- run 34472151740 wrote `Tables/dbo/demo` while a by-hand run of
          # the same shape landed at `Tables/<name>` -- so guessing produces a 404 that reads like
          # "the write failed" when the write succeeded.
          import requests
          ws, item = os.environ["WAREHOUSE_PATH"].split("/", 1)
          r = requests.get(
              f"{os.environ['ONELAKE_ENDPOINT']}/v1/{ws}/{item}/namespaces/dbo/tables/demo",
              headers={"Authorization": f"Bearer {os.environ['ONELAKE_TOKEN']}"}, timeout=120)
          r.raise_for_status()
          loc = r.json()["metadata"]["location"]
          print("table location:", loc)
          g = f"{loc}/data/*.parquet"
          files, rgs = c.sql(f"SELECT count(*), sum(num_row_groups) "
                             f"FROM parquet_file_metadata('{g}')").fetchone()
          mx, avg, rows = c.sql(f"SELECT max(row_group_num_rows), avg(row_group_num_rows), "
                                f"sum(row_group_num_rows) FROM parquet_metadata('{g}')").fetchone()
          # parquet_metadata returns one row per COLUMN CHUNK, so the row sum is rows x columns.
          cols = c.sql(f"SELECT count(*) FROM parquet_metadata('{g}') "
                       f"WHERE file_name = (SELECT min(file_name) FROM parquet_metadata('{g}')) "
                       f"AND row_group_id = 0").fetchone()[0]
          print(f"files={files} row_groups={rgs} max_rows_per_rg={mx:,} avg={avg:,.0f}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              print(f"| files | {files} |", file=fh)
              print(f"| row groups | {rgs} |", file=fh)
              print(f"| rows per row group | max **{mx:,}**, avg {avg:,.0f} |", file=fh)
              print(f"| total rows | {rows // cols:,} |", file=fh)
          PY

      # ---------------------------------------------------------------- always
      # `always()`, and it deletes BY GUID from the record `ensure()` wrote — so a failure anywhere
      # above still removes the lakehouse rather than leaving it drawing background CU.
      - name: Teardown
        if: always()
        run: |
          if [ -f "$RUN_RECORD" ]; then
            python .github/scripts/provision.py teardown "$RUN_RECORD"
          else
            echo "no run record — nothing was provisioned"
          fi
