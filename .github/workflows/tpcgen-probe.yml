name: tpcgen probe
# TEMPORARY. Answers whether tpcgen-cli can replace DuckDB dsdgen for the tpcds landing. Free runner,
# no Fabric, no secrets. Deleted once answered.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install tpcgen-cli==4.0.0 duckdb
      - name: Per-column diff at SF1
        run: |
          tpcgen-cli tpcds parquet -s 1 -q --output-dir /tmp/tg
          python - <<'EOF'
          import os, sys, duckdb
          sys.path.insert(0, os.getcwd())
          import download_tpcds as G
          con = duckdb.connect()
          con.sql("INSTALL tpcds; LOAD tpcds; CALL dsdgen(sf=1)")
          print("duckdb", duckdb.__version__)
          for t in G.TABLES:
              con.sql(f"CREATE TABLE g_{t} AS FROM read_parquet('/tmp/tg/{t}.parquet')")
          con.sql("ALTER TABLE g_store RENAME s_tax_precentage TO s_tax_percentage")
          keys = dict(G.FACT_KEYS)
          for t in G.TABLES:
              cols = [r[0] for r in con.sql(f"DESCRIBE {t}").fetchall()]
              k = keys.get(t, (cols[0],))
              on = " AND ".join(f"d.{c} = g.{c}" for c in k)
              n_join = con.sql(f"SELECT count(*) FROM {t} d JOIN g_{t} g ON {on}").fetchone()[0]
              print(f"\n== {t}: joined {n_join:,} of {con.sql(f'select count(*) from {t}').fetchone()[0]:,} on {k}")
              for c in cols:
                  if c in k: continue
                  q = f"SELECT count(*) FILTER (WHERE d.{c}::VARCHAR IS DISTINCT FROM g.{c}::VARCHAR), count(*) FILTER (WHERE d.{c} IS NULL), count(*) FILTER (WHERE g.{c} IS NULL) FROM {t} d JOIN g_{t} g ON {on}"
                  diff, dn, gn = con.sql(q).fetchone()
                  if diff:
                      s = con.sql(f"SELECT d.{c}::VARCHAR, g.{c}::VARCHAR FROM {t} d JOIN g_{t} g ON {on} WHERE d.{c}::VARCHAR IS DISTINCT FROM g.{c}::VARCHAR LIMIT 3").fetchall()
                      print(f"   {c:28s} differ {diff:>10,}  nulls dsdgen {dn:>8,} tpcgen {gn:>8,}  e.g. {s}")
          EOF
      - name: tpcgen SF10 landed counts against the paper
        run: |
          /usr/bin/time -v tpcgen-cli tpcds parquet -s 10 -q --tables store_sales,catalog_sales,date_dim --parts 8 --output-dir /tmp/s10 2>&1 | grep -E "Elapsed|Maximum resident" || true
          du -sh /tmp/s10/* || true
          python - <<'EOF'
          import os, sys, duckdb
          sys.path.insert(0, os.getcwd())
          import download_tpcds as G
          con = duckdb.connect()
          for t in ("store_sales", "catalog_sales"):
              src = f"read_parquet('/tmp/s10/{t}/*.parquet')"
              raw = con.sql(f"SELECT count(*) FROM {src}").fetchone()[0]
              landed = con.sql(f"SELECT count(*) FROM ({G.customise_sql(t, src)})").fetchone()[0]
              print(f"{t}: raw {raw:,} (spec {G.EXPECTED[10][t]:,})  landed {landed:,}  paper {G.PAPER_ROWS[10][t]:,}  {'MATCH' if landed == G.PAPER_ROWS[10][t] else 'DIFF'}")
          EOF
