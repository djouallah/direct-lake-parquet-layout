name: 'aemo_electricity'
version: '1.0.0'

profile: 'aemo_electricity'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

# Engine-specific session setup. Each hook renders to whitespace (a no-op) on the
# targets it doesn't apply to, so ONE project file serves all four engines.
on-run-start:
  # DuckDB azure transport (Delta + Iceberg read OneLake CSV/parquet through it). Only fire
  # when explicitly configured (cloud runners set it to 'curl'); skipped on a local/offline
  # run where the azure extension isn't loaded and the SET would raise.
  - "{% if target.name in ['duckrun', 'iceberg'] and env_var('AZURE_TRANSPORT_OPTION_TYPE', 'default') != 'default' %}SET GLOBAL azure_transport_option_type = '{{ env_var('AZURE_TRANSPORT_OPTION_TYPE') }}'{% endif %}"
  # Iceberg spills large aggregations; set the temp dir once before anything spills.
  - "{% if target.name == 'iceberg' %}SET GLOBAL temp_directory = '{{ env_var('DUCKDB_TEMP_DIR', '/tmp/duckdb_spill') }}'{% endif %}"
  # duckrun: match what iceberg already gets from profiles.yml (`settings:` + the temp_directory
  # hook above), so the two DuckDB legs run on IDENTICAL DuckDB settings and the only difference
  # left between them is the writer.
  # There was a `SET GLOBAL memory_limit = 4GB` here, on duckrun ONLY. It capped one half of the
  # pair the CU dashboard calls "the sharpest comparison" while iceberg — the same DuckDB, same
  # notebook, same FABRIC_CORES — ran at DuckDB's default (~80% of node RAM). Its comment said the
  # cap stopped a big fact build OOMing "the runner", which described the deleted GitHub-runner
  # path, not the Fabric notebook this runs on now; and DUCKDB_MEMORY_LIMIT was never in
  # fabric_run.py's _FORWARD tuple, so the 4GB default always applied in CI and could not be
  # dispatched around. Removing it also lifts duckrun's MERGE budget, which is a 0.3 share of the
  # global limit (set_merge_memory_limit): 0.3 x default instead of 0.3 x 4GB. Spill is unaffected
  # — temp_directory below still applies.
  - "{% if target.name == 'duckrun' %}SET GLOBAL preserve_insertion_order = false{% endif %}"
  - "{% if target.name == 'duckrun' %}SET GLOBAL temp_directory = '{{ env_var('DUCKDB_TEMP_DIR', '/tmp/duckdb_spill') }}'{% endif %}"
  # Read the settings BACK, from the session that is about to run the models — the hooks above say
  # what was asked for, this says what is in force. It is the only thing that can tell a DuckDB
  # misconfiguration from a node that simply has less RAM, which is the question a `cores: 4`
  # dispatch OOMing on fct_summary at 24.6 GiB leaves open. Watch max_temp_directory_size in
  # particular: it defaults to 90% of free disk under temp_directory, so a small work disk is a
  # small spill budget and nothing announces it. Runs on BOTH duckdb targets, so the pair stays on
  # identical settings; renders to whitespace on dwh and spark.
  - "{% if target.name in ['duckrun', 'iceberg'] %}{{ log_duckdb_settings() }}{% endif %}"
  # Fabric Warehouse has no implicit schemas — create them before any model runs.
  - "{% if target.type == 'fabric' %}{{ create_schemas_if_not_exists(['landing', 'mart']) }}{% endif %}"

# models/<DATASET>/<DIALECT>/<LAYER>. Two axes, and exactly one (dataset, dialect) tree is enabled
# per run: the dialect from `target.type`, the dataset from the DATASET env var (a dispatch input).
# Within a dataset the model NAMES are shared across its three dialects, which is what lets ref(),
# the dataset's own patch files and its singular tests be written once.
#
# THREE RULES, all of them learned the expensive way. Read them before touching a `+enabled`.
#
# 1. NOTHING ON THE `aemo_electricity` KEY, EVER. A generic test declared in a patch file gets the
#    fqn of the YML FILE, not of the model it patches (dbt/parser/schema_generic_tests.py) — so a
#    gate on the project key matches it too. That is what a bare
#    `aemo_electricity: +enabled: <duckdb only>` once did: it disabled the four unique/not_null
#    tests along with the singular ones, and `dbt build --target dwh` (and --target spark) ran ZERO
#    tests while this file and the workflow both read as though the generic ones still applied.
#    Putting the patch files under models/<dataset>/ is what gives them a gateable folder segment;
#    do not move them back to the root of models/.
#
# 2. BOTH AXES IN ONE `+enabled`, ON THE DIALECT KEY. `+enabled` is a scalar, so a deeper folder key
#    CLOBBERS a shallower one — putting `target.type` here and DATASET on the dataset key above
#    parses clean, runs clean, and builds the WRONG DATASET with nothing red. Under `data_tests:`
#    the dataset key DOES carry a gate (it is the only key a generic test's fqn touches) and the
#    dialect keys below it must therefore REPEAT the dataset clause.
#
# 3. ALWAYS `env_var('DATASET', 'aemo')` WITH THE DEFAULT — a bare env_var() raises at parse for
#    anyone who has not exported it, including every offline check.
#
# Verify with `.github/scripts/check_gating.py`, not by reading this comment: it runs the whole
# (dataset x target) matrix through `dbt parse` and asserts the enabled model AND test sets plus
# every fqn, in seconds, with no credentials. A DATASET typo makes every gate below false, and then
# `dbt build` reports "Nothing to do" and exits GREEN having built nothing.
models:
  aemo_electricity:
    aemo:                                                    # AEMO NEM — CSV, 8 models
      duckdb:                                                # Delta (duckrun) + Iceberg
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'aemo' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: landing}
      dwh:                                                   # Fabric Warehouse (T-SQL)
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'aemo' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: landing}
      spark:                                                 # Fabric Spark (Spark SQL)
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'aemo' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: landing}
    nyc:                                                     # NYC TLC yellow taxi — parquet, 4 models
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'nyc' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'nyc' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'nyc' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
    bts:                                                     # BTS on-time flights — zipped CSV, 4 models
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'bts' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'bts' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'bts' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
    green:                                                   # NYC TLC green taxi — parquet, 4 models
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'green' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'green' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'green' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
    cms:                                                     # CMS Open Payments — annual CSV, 4 models
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'cms' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'cms' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'cms' }}"
        staging:    {+materialized: view,        +schema: landing}
        dimensions: {+materialized: table,       +schema: mart}
        marts:      {+materialized: incremental,  +schema: mart}

# Singular tests, tests/<DATASET>/<DIALECT>/ — the same two axes as models/ above, gated the same
# way, so every engine runs the same assertions in its own dialect against the output it just wrote.
#
# The dataset key carries a gate here and does NOT above, and that asymmetry is the whole point: a
# generic test's fqn is ['aemo_electricity', '<dataset>', '<test_name>'] — dataset segment, no
# dialect segment — so this is the only key that can reach it, and it must not carry a target.type
# clause or the generic tests go back to running on one engine. The dialect keys below then repeat
# the dataset clause because a deeper `+enabled` replaces the shallower one outright (rule 2).
data_tests:
  aemo_electricity:
    aemo:
      +enabled: "{{ env_var('DATASET', 'aemo') == 'aemo' }}"
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'aemo' }}"
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'aemo' }}"
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'aemo' }}"
    nyc:
      +enabled: "{{ env_var('DATASET', 'aemo') == 'nyc' }}"
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'nyc' }}"
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'nyc' }}"
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'nyc' }}"
    bts:
      +enabled: "{{ env_var('DATASET', 'aemo') == 'bts' }}"
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'bts' }}"
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'bts' }}"
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'bts' }}"
    green:
      +enabled: "{{ env_var('DATASET', 'aemo') == 'green' }}"
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'green' }}"
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'green' }}"
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'green' }}"
    cms:
      +enabled: "{{ env_var('DATASET', 'aemo') == 'cms' }}"
      duckdb:
        +enabled: "{{ target.type in ['duckrun', 'duckdb'] and env_var('DATASET', 'aemo') == 'cms' }}"
      dwh:
        +enabled: "{{ target.type == 'fabric' and env_var('DATASET', 'aemo') == 'cms' }}"
      spark:
        +enabled: "{{ target.type == 'fabricspark' and env_var('DATASET', 'aemo') == 'cms' }}"
