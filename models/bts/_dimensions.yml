version: 2

# The bts dimensions are named dim_carrier and dim_flight_date, NOT dim_calendar or dim_date, and
# that is a hard requirement rather than a style choice: dbt resolves a patch by model NAME across
# the whole project and raises DuplicatePatchPathError if two yml files patch the same name —
# regardless of which dataset is gated on, because gating and patching are resolved separately.

models:
  - name: dim_carrier
    description: >
      BTS's unique-carrier lookup (Code -> Description, landed as code/name), from the parquet the
      downloader lands under parquet_raw/carrier/. code is a STRING join key — the first since
      AEMO's DUID — so this dataset carries the whitespace assertion in all three dialects: T-SQL
      pads on comparison, DuckDB and Spark do not, and a padded key splits the engines silently.
    columns:
      - name: code
        description: Unique carrier code, joined from fct_flights.Reporting_Airline
        tests:
          - unique
          - not_null
      - name: name
        description: Carrier name, e.g. 'American Airlines Inc.'

  - name: dim_flight_date
    description: Date dimension over the archive's span, 1987-2026
    columns:
      - name: date
        description: Calendar date
        tests:
          - unique
          - not_null
      - name: year
        description: Calendar year
      - name: month
        description: Month number, 1-12
      - name: day_of_week
        description: >
          0=Sunday. Normalised identically in all three dialects — DuckDB EXTRACT(dow) is already
          0-based, Spark's dayofweek() is 1-based and T-SQL's DATEPART depends on DATEFIRST — so
          the three engines store the SAME value. Distinct from the fact's DayOfWeek, which is
          BTS's own published 1=Monday..7=Sunday and is stored verbatim as source data.
