version: 2

# See _dimensions.yml for why these files live at models/tpcds/ and why the models keep their
# TPC-DS names.

models:
  - name: store_sales
    description: >
      The larger of the white paper's two fact tables and this dataset's MART: the table stats.py
      profiles deeply, the layout tables rank, and the selectivity ladder filters. 26,206,837 rows
      at SF10 and 262,082,396 at SF100, which is the volume the paper's Direct Lake findings turn
      on.

      A FULL REBUILD, NOT A FILE-DRIVEN INCREMENTAL, and the only fact in this project that works
      that way. dsdgen emits an entire scale factor in one call, so there is no arrival order to
      increment along, no watermark and nothing to top up -- which is why there is no `file` column
      here where every other fact has one. The paper writes this table with a single CTAS and so
      does this.

      Its columns are the paper's: dsdgen's 23 plus `cache_buster`, an INTEGER of 1 the paper adds
      so a load test can randomise a filter against it and defeat Databricks result caching.
      Nothing in this project reads it; it is carried so the tables match.

      NO GRAIN TEST, AND THE WRITE IS THE GUARD. (ss_item_sk, ss_ticket_number) is the TPC-DS
      primary key and is genuinely unique once the null rule has run, so the duckdb tree merges on
      it and dwh and spark rewrite the table whole. What remains for a test is the landing itself,
      which is what assert_store_sales_matches_archive_log checks.
    columns:
      - name: cache_buster
        description: Constant 1, added by the paper's section 4.5 customisation. Unread here.
      - name: ss_sold_date_sk
        description: >
          Joins date_dim on d_date_sk_1, NOT on d_date_sk. Every composite query in the suite
          groups or filters through that relationship.
      - name: ss_ticket_number
        description: Second half of the TPC-DS primary key, with ss_item_sk.

  - name: catalog_sales
    description: >
      The second fact table, 14,257,451 rows at SF10. It is a full member of this dataset -- the
      parity table, the Tables shortcuts, the semantic model and two of the paper's five queries all
      carry it -- and it is deliberately NOT the registry's `mart`, because `mart` names the single
      table stats.py profiles deeply and a second deep profile would double a ten-minute OneLake
      read to answer a question the first one already answers.

      Same shape as store_sales: a full rebuild, no `file` column, dsdgen's 34 columns plus
      `cache_buster`, keyed on the TPC-DS primary key (cs_item_sk, cs_order_number).

      It reaches customer_address and customer_demographics twice over -- once through the billing
      keys and once through the shipping keys -- and the paper deactivates the shipping
      relationships so the path stays unambiguous. The semantic model does the same.
    columns:
      - name: cache_buster
        description: Constant 1, as on store_sales.
      - name: cs_sold_date_sk
        description: Joins date_dim on d_date_sk_1.
      - name: cs_order_number
        description: Second half of the TPC-DS primary key, with cs_item_sk.
