version: 2

# The NYC dimensions are named dim_zone and dim_date, NOT dim_calendar, and that is a hard
# requirement rather than a style choice: dbt resolves a patch by model NAME across the whole
# project and raises DuplicatePatchPathError if two yml files patch the same name — regardless of
# which dataset is gated on, because gating and patching are resolved separately. Two datasets each
# wanting a `dim_calendar` entry is therefore a parse error, not a duplication smell.

models:
  - name: dim_zone
    description: >
      The 265 TLC taxi zones, from the lookup the downloader lands under parquet_raw/zone/.
      LocationID is an INTEGER key — which is why this dataset carries no whitespace assertion:
      the T-SQL-pads-on-comparison pathology assert_duid_has_no_whitespace guards can only bite a
      STRING join key. A string key added here would need all three dialect copies.
    columns:
      - name: LocationID
        description: Zone id, joined from fct_trips.PULocationID and DOLocationID
        tests:
          - unique
          - not_null
      - name: Borough
        description: One of Manhattan, Brooklyn, Queens, Bronx, Staten Island, EWR, Unknown
      - name: Zone
        description: Zone name, e.g. 'JFK Airport'
      - name: service_zone
        description: Yellow Zone, Boro Zone, Airports or EWR

  - name: dim_date
    description: Date dimension over the archive's span, 2011-2026
    columns:
      - name: date
        description: Calendar date
        tests:
          - unique
          - not_null
      - name: year
        description: Calendar year
      - name: month
        description: Month number, 1-12
      - name: day_of_week
        description: >
          0=Sunday. Normalised identically in all three dialects — DuckDB EXTRACT(dow) is already
          0-based, Spark's dayofweek() is 1-based and T-SQL's DATEPART depends on DATEFIRST — so
          the three engines store the SAME value and a parity difference here would be real.
